<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="pagina-protegida" content="true">
    <title>Kanban | Central de Artes GACC-AM</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            background: #FFC107;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* ── HEADER ─────────────────────────────── */
      header {
            background: #6B21A8;
            padding: 14px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 200;
            flex-wrap: wrap;
        }

  <header>
 <div class="logo-gacc">
    <img src="logo-gacc-branca.png" alt="GACC-AM" style="height: 100px; object-fit: contain;">
</div>

        .header-nav {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .nav-link {
            color: rgba(255,255,255,.7);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            padding: 7px 14px;
            border-radius: 999px;
            transition: all .2s;
            white-space: nowrap;
        }

        .nav-link:hover, .nav-link.active {
            background: rgba(255,255,255,.18);
            color: white;
        }

        .btn-nova {
            background: linear-gradient(135deg, #FF8C42, #FF4444);
            color: white;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 800;
            transition: all .2s;
            white-space: nowrap;
            border: none;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
        }

        .btn-nova:hover { opacity: .9; transform: translateY(-1px); }

        .btn-sair {
            background: none;
            border: none;
            color: rgba(255,255,255,.55);
            font-size: 13px;
            font-weight: 700;
            padding: 7px 12px;
            border-radius: 999px;
            cursor: pointer;
            transition: all .2s;
            font-family: 'Nunito', sans-serif;
        }

        .btn-sair:hover { background: rgba(255,0,0,.2); color: white; }

        /* ── BOARD WRAPPER ───────────────────────── */
        .board-wrapper {
            flex: 1;
            padding: 24px 20px 40px;
            overflow-x: auto;
        }

        /* ── TÍTULO DA PÁGINA ───────────────────── */
        .board-titulo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .board-titulo h2 {
            font-size: 26px;
            font-weight: 900;
            color: #1a0533;
            letter-spacing: -0.5px;
        }

        .board-titulo p {
            font-size: 13px;
            font-weight: 700;
            color: rgba(26,5,51,.55);
            margin-top: 2px;
        }

        .btn-limpar {
            background: white;
            color: #dc2626;
            border: 2px solid #fecaca;
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: all .2s;
            font-family: 'Nunito', sans-serif;
        }

        .btn-limpar:hover { background: #fef2f2; border-color: #dc2626; }

        /* ── KANBAN BOARD ────────────────────────── */
        .kanban-board {
            display: flex;
            gap: 14px;
            min-width: max-content;
            align-items: flex-start;
        }

        /* ── COLUNAS ─────────────────────────────── */
        .kanban-col {
            width: 270px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,.1);
        }

        .col-header {
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Cores por coluna */
        .col-nova      .col-header { background: #6B21A8; }
        .col-analise   .col-header { background: #d97706; }
        .col-criacao   .col-header { background: #1d4ed8; }
        .col-aprovacao .col-header { background: #be185d; }
        .col-entregue  .col-header { background: #16a34a; }

        .col-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .col-icone {
            width: 30px;
            height: 30px;
            background: rgba(255,255,255,.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .col-titulo {
            font-size: 13px;
            font-weight: 900;
            color: white;
            text-transform: uppercase;
            letter-spacing: .06em;
        }

        .col-count {
            background: rgba(255,255,255,.25);
            color: white;
            font-size: 12px;
            font-weight: 900;
            padding: 3px 9px;
            border-radius: 999px;
            min-width: 26px;
            text-align: center;
        }

        /* Corpo da coluna */
        .kanban-drop-zone {
            flex: 1;
            padding: 10px;
            min-height: 120px;
            background: rgba(255,255,255,.85);
            transition: background .15s;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .kanban-drop-zone.sobre {
            background: rgba(255,255,255,1);
            outline: 3px dashed rgba(107,33,168,.4);
            outline-offset: -4px;
        }

        /* ── CARDS ───────────────────────────────── */
        .kanban-card {
            background: white;
            border-radius: 14px;
            padding: 14px;
            cursor: grab;
            border: 2px solid #f3f4f6;
            transition: border-color .15s, box-shadow .15s;
            user-select: none;
            position: relative;
        }

        .kanban-card:hover {
            border-color: #d8b4fe;
            box-shadow: 0 6px 20px rgba(107,33,168,.15);
        }

        /* Linha colorida no topo do card por prioridade */
        .kanban-card::before {
            content: "";
            display: block;
            height: 3px;
            border-radius: 999px;
            margin-bottom: 10px;
        }

        .kanban-card[data-prio="Alta"]::before  { background: linear-gradient(90deg, #FF4444, #FF8C42); }
        .kanban-card[data-prio="Média"]::before { background: linear-gradient(90deg, #d97706, #fbbf24); }
        .kanban-card[data-prio="Baixa"]::before { background: linear-gradient(90deg, #16a34a, #4ade80); }

        /* Clone arrastando */
        .kanban-card-clone {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            opacity: .92;
            transform: rotate(2deg) scale(1.04);
            box-shadow: 0 16px 40px rgba(107,33,168,.25);
            border-radius: 14px;
            background: white;
            padding: 14px;
            border: 2px solid #d8b4fe;
        }

        /* Card esmaecido durante drag */
        .kanban-card.arrastando {
            opacity: .35;
            cursor: grabbing;
        }

        /* Placeholder */
        .kanban-placeholder {
            background: #f3e8ff;
            border: 2px dashed #c084fc;
            border-radius: 14px;
            pointer-events: none;
            flex-shrink: 0;
        }

        /* Linha de tipo da peça */
        .card-tipo {
            font-size: 13px;
            font-weight: 900;
            color: #1a1a2e;
            margin-bottom: 5px;
            line-height: 1.2;
        }

        /* Nome do solicitante */
        .card-solicitante {
            font-size: 12px;
            font-weight: 700;
            color: #6B21A8;
            margin-bottom: 6px;
        }

        /* Resumo objetivo */
        .card-objetivo {
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            line-height: 1.45;
            max-height: 3em;
            overflow: hidden;
            margin-bottom: 10px;
        }

        /* Footer do card */
        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .tag-prio {
            display: inline-block;
            font-size: 10px;
            font-weight: 900;
            padding: 3px 9px;
            border-radius: 999px;
            text-transform: uppercase;
            letter-spacing: .04em;
        }

        .tag-prio.alta  { background: #fee2e2; color: #dc2626; }
        .tag-prio.media { background: #fef3c7; color: #d97706; }
        .tag-prio.baixa { background: #dcfce7; color: #16a34a; }

        .card-prazo {
            font-size: 11px;
            font-weight: 700;
            color: #9ca3af;
        }

        /* Botão de detalhe */
        .card-btn-detalhe {
            background: none;
            border: none;
            color: #c084fc;
            cursor: pointer;
            font-size: 16px;
            padding: 2px 4px;
            border-radius: 6px;
            transition: background .15s;
            line-height: 1;
        }

        .card-btn-detalhe:hover { background: #f3e8ff; color: #6B21A8; }

        /* Estado vazio */
        .col-vazia {
            text-align: center;
            color: #d1d5db;
            font-size: 13px;
            font-weight: 700;
            padding: 24px 12px;
        }

        .col-vazia span {
            display: block;
            font-size: 28px;
            margin-bottom: 6px;
            opacity: .5;
        }

        /* ── MODAL DETALHE ────────────────────────── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(26,5,51,.55);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: white;
            border-radius: 24px;
            padding: 0;
            width: 100%;
            max-width: 580px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 24px 60px rgba(107,33,168,.25);
            transform: translateY(12px) scale(.97);
            transition: transform .2s;
        }

        .modal-overlay.open .modal { transform: translateY(0) scale(1); }

        .modal-topo {
            background: linear-gradient(135deg, #6B21A8, #9333ea);
            padding: 24px 28px 20px;
            border-radius: 24px 24px 0 0;
            position: relative;
        }

        .modal-badge {
            display: inline-block;
            background: rgba(255,255,255,.2);
            color: white;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 999px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: .06em;
        }

        .modal-titulo {
            font-size: 22px;
            font-weight: 900;
            color: white;
            letter-spacing: -.5px;
            margin-bottom: 4px;
        }

        .modal-prio-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 900;
            padding: 3px 10px;
            border-radius: 999px;
            text-transform: uppercase;
        }

        .modal-fechar {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            background: rgba(255,255,255,.2);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s;
        }

        .modal-fechar:hover { background: rgba(255,255,255,.35); }

        .modal-corpo {
            padding: 24px 28px;
        }

        .modal-secao {
            margin-bottom: 20px;
        }

        .modal-secao-titulo {
            font-size: 10px;
            font-weight: 900;
            color: #6B21A8;
            text-transform: uppercase;
            letter-spacing: .08em;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 2px solid #f3e8ff;
        }

        .modal-campo {
            margin-bottom: 12px;
        }

        .modal-campo label {
            font-size: 11px;
            font-weight: 800;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: .05em;
            display: block;
            margin-bottom: 3px;
        }

        .modal-campo p {
            font-size: 14px;
            font-weight: 700;
            color: #1a1a2e;
            line-height: 1.5;
        }

        .modal-campo p.vazio { color: #d1d5db; font-style: italic; }

        .modal-campo a {
            color: #6B21A8;
            font-size: 14px;
            font-weight: 700;
            word-break: break-all;
        }

        .modal-campo img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 12px;
            border: 2px solid #f3f4f6;
            margin-top: 6px;
            object-fit: cover;
            display: block;
        }

        .modal-campo video {
            max-width: 100%;
            max-height: 200px;
            border-radius: 12px;
            display: block;
            margin-top: 6px;
        }

        .modal-rodape {
            padding: 16px 28px 24px;
            display: flex;
            justify-content: flex-end;
        }

        .btn-fechar-modal {
            background: linear-gradient(135deg, #6B21A8, #9333ea);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            transition: opacity .2s;
        }

        .btn-fechar-modal:hover { opacity: .88; }

        /* ── TOAST ────────────────────────────────── */
        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(16px);
            background: #1a0533;
            color: white;
            padding: 11px 22px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Nunito', sans-serif;
            opacity: 0;
            pointer-events: none;
            transition: all .25s;
            z-index: 99999;
            white-space: nowrap;
        }

        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ── LOADING ──────────────────────────────── */
        .loading-col {
            text-align: center;
            padding: 28px 12px;
            color: #9ca3af;
            font-size: 13px;
            font-weight: 700;
        }

        /* ── RESPONSIVO ───────────────────────────── */
        @media (max-width: 768px) {
            header { padding: 12px 16px; }
            .board-wrapper { padding: 16px 12px 40px; }
            .kanban-col { width: 250px; }
        }
    </style>
</head>
<body>

<!-- HEADER -->
<header>
    <div class="logo-gacc">
        <h1>GACC<span>.</span>AM</h1>
        <p>Fluxo de Demandas</p>
    </div>
    <nav class="header-nav">
        <a href="index.html"     class="nav-link">Início</a>
        <a href="solicitar.html" class="nav-link">Solicitar</a>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="kanban.html"    class="nav-link active">Kanban</a>
        <a href="solicitar.html" class="btn-nova">+ Nova Arte</a>
        <button class="btn-sair" onclick="fazerLogout()">Sair</button>
    </nav>
</header>

<!-- BOARD -->
<div class="board-wrapper">

    <div class="board-titulo">
        <div>
            <h2>Fluxo de Demandas</h2>
            <p>Arraste os cards para mover entre as etapas</p>
        </div>
        <button class="btn-limpar" onclick="confirmarLimpar()">🗑 Limpar tudo</button>
    </div>

    <div class="kanban-board">

        <div class="kanban-col col-nova">
            <div class="col-header">
                <div class="col-header-left">
                    <div class="col-icone"></div>
                    <span class="col-titulo">Novas</span>
                </div>
                <span class="col-count" id="countNova">0</span>
            </div>
            <div class="kanban-drop-zone" id="colunaNova" data-status="Nova"></div>
        </div>

        <div class="kanban-col col-analise">
            <div class="col-header">
                <div class="col-header-left">
                    <div class="col-icone"></div>
                    <span class="col-titulo">Em Análise</span>
                </div>
                <span class="col-count" id="countAnalise">0</span>
            </div>
            <div class="kanban-drop-zone" id="colunaAnalise" data-status="Analise"></div>
        </div>

        <div class="kanban-col col-criacao">
            <div class="col-header">
                <div class="col-header-left">
                    <div class="col-icone"></div>
                    <span class="col-titulo">Em Criação</span>
                </div>
                <span class="col-count" id="countCriacao">0</span>
            </div>
            <div class="kanban-drop-zone" id="colunaCriacao" data-status="Criacao"></div>
        </div>

        <div class="kanban-col col-aprovacao">
            <div class="col-header">
                <div class="col-header-left">
                    <div class="col-icone"</div>
                    <span class="col-titulo">Aprovação</span>
                </div>
                <span class="col-count" id="countAprovacao">0</span>
            </div>
            <div class="kanban-drop-zone" id="colunaAprovacao" data-status="Aprovacao"></div>
        </div>

        <div class="kanban-col col-entregue">
            <div class="col-header">
                <div class="col-header-left">
                    <div class="col-icone"></div>
                    <span class="col-titulo">Entregue</span>
                </div>
                <span class="col-count" id="countEntregue">0</span>
            </div>
            <div class="kanban-drop-zone" id="colunaEntregue" data-status="Entregue"></div>
        </div>

    </div>
</div>

<!-- MODAL DETALHE -->
<div class="modal-overlay" id="modalDetalhe">
    <div class="modal">
        <div class="modal-topo">
            <button class="modal-fechar" onclick="fecharModal()">×</button>
            <div class="modal-badge" id="mBadge">Nova</div>
            <div class="modal-titulo" id="mTitulo">—</div>
            <span class="modal-prio-badge" id="mPrio"></span>
        </div>
        <div class="modal-corpo" id="mCorpo"></div>
        <div class="modal-rodape">
            <button class="btn-fechar-modal" onclick="fecharModal()">Fechar</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>

// ── PROTEÇÃO DE ROTA ──────────────────────────────────────
(async () => {
    const sess = await supabaseClient.auth.getSession();
    if (!sess.data.session) window.location.href = "login.html";
})();

// ── MAPEAMENTOS ───────────────────────────────────────────
const ZONAS = {
    Nova:      document.getElementById("colunaNova"),
    Analise:   document.getElementById("colunaAnalise"),
    Criacao:   document.getElementById("colunaCriacao"),
    Aprovacao: document.getElementById("colunaAprovacao"),
    Entregue:  document.getElementById("colunaEntregue")
};

const CONTADORES = {
    Nova:      document.getElementById("countNova"),
    Analise:   document.getElementById("countAnalise"),
    Criacao:   document.getElementById("countCriacao"),
    Aprovacao: document.getElementById("countAprovacao"),
    Entregue:  document.getElementById("countEntregue")
};

const STATUS_LABEL = {
    Nova:"Nova", Analise:"Em Análise", Criacao:"Em Criação",
    Aprovacao:"Aprovação", Entregue:"Entregue"
};

// ── DRAG STATE ────────────────────────────────────────────
const drag = {
    ativo: false, arrastou: false,
    cardEl: null, clone: null, placeholder: null,
    id: null, statusOrigem: null, offsetX: 0, offsetY: 0
};

// ── INIT ──────────────────────────────────────────────────
document.addEventListener("DOMContentLoaded", carregarKanban);
document.addEventListener("mousemove", onMouseMove);
document.addEventListener("mouseup",   onMouseUp);

// ── CARREGAR KANBAN ───────────────────────────────────────
async function carregarKanban() {
    Object.values(ZONAS).forEach(z => {
        z.innerHTML = '<div class="loading-col">Carregando...</div>';
    });

    const { data, error } = await supabaseClient
        .from("Solicitacoes")
        .select("*")
        .order("id", { ascending: false });

    if (error) {
        Object.values(ZONAS).forEach(z => {
            z.innerHTML = '<div class="col-vazia"><span>⚠️</span>Erro ao carregar</div>';
        });
        return;
    }

    Object.keys(ZONAS).forEach(status => {
        const zona = ZONAS[status];
        zona.innerHTML = "";
        const itens = data.filter(i => i.status === status);
        CONTADORES[status].textContent = itens.length;
        if (itens.length === 0) {
            zona.innerHTML = '<div class="col-vazia"><span>📭</span>Sem demandas aqui</div>';
        } else {
            itens.forEach(item => zona.appendChild(criarCard(item)));
        }
    });
}

// ── CRIAR CARD ────────────────────────────────────────────
function criarCard(item) {
    const card = document.createElement("div");
    card.className = "kanban-card";
    card.dataset.id     = item.id;
    card.dataset.status = item.status;
    card.dataset.prio   = item.prioridade || "Baixa";

    const prioClasse = (item.prioridade || "Baixa")
        .toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "");

    const dataFmt = item.entrega ? formatarData(item.entrega) : "";

    // Trunca objetivo em 80 chars
    const resumo = (item.objetivo || "").length > 80
        ? item.objetivo.substring(0, 80) + "…"
        : item.objetivo || "";

    card.innerHTML = `
        <div class="card-tipo">${item.tipo || "—"}</div>
        <div class="card-solicitante">👤 ${item.nome || "—"} · ${item.setor || "—"}</div>
        ${resumo ? `<div class="card-objetivo">${resumo}</div>` : ""}
        <div class="card-footer">
            <span class="tag-prio ${prioClasse}">${item.prioridade || "Baixa"}</span>
            ${dataFmt ? `<span class="card-prazo">📅 ${dataFmt}</span>` : ""}
            <button class="card-btn-detalhe" title="Ver briefing completo" onclick="(function(e){e.stopPropagation();abrirModal(${item.id});})(event)">🔍</button>
        </div>
    `;

    card.addEventListener("mousedown", iniciarDrag);

    // Clique simples abre modal (se não arrastou)
    card.addEventListener("click", function(e) {
        if (e.target.closest(".card-btn-detalhe")) return;
        if (drag.arrastou) return;
        abrirModal(item.id);
    });

    return card;
}

// ── DRAG: INICIAR ─────────────────────────────────────────
function iniciarDrag(e) {
    if (e.target.closest(".card-btn-detalhe")) return;
    if (e.button !== 0) return;
    e.preventDefault();

    const card = this;
    const rect = card.getBoundingClientRect();

    const clone = card.cloneNode(true);
    clone.className = "kanban-card kanban-card-clone";
    clone.style.width  = rect.width + "px";
    clone.style.height = rect.height + "px";
    clone.style.left   = rect.left + "px";
    clone.style.top    = rect.top  + "px";
    document.body.appendChild(clone);

    const ph = document.createElement("div");
    ph.className = "kanban-placeholder";
    ph.style.height = rect.height + "px";
    card.parentNode.insertBefore(ph, card);
    card.style.visibility = "hidden";

    drag.ativo        = true;
    drag.arrastou     = false;
    drag.cardEl       = card;
    drag.clone        = clone;
    drag.placeholder  = ph;
    drag.id           = parseInt(card.dataset.id);
    drag.statusOrigem = card.dataset.status;
    drag.offsetX      = e.clientX - rect.left;
    drag.offsetY      = e.clientY - rect.top;
}

// ── DRAG: MOVER ───────────────────────────────────────────
function onMouseMove(e) {
    if (!drag.ativo) return;
    drag.arrastou = true;

    drag.clone.style.left = (e.clientX - drag.offsetX) + "px";
    drag.clone.style.top  = (e.clientY - drag.offsetY) + "px";

    drag.clone.style.visibility = "hidden";
    const elAbaixo = document.elementFromPoint(e.clientX, e.clientY);
    drag.clone.style.visibility = "";

    Object.values(ZONAS).forEach(z => z.classList.remove("sobre"));
    if (!elAbaixo) return;

    const zona = elAbaixo.closest(".kanban-drop-zone");
    if (!zona) return;
    zona.classList.add("sobre");

    const cards = [...zona.querySelectorAll(".kanban-card:not(.arrastando)")].filter(c => c !== drag.cardEl);
    let inserirAntes = null;
    for (const c of cards) {
        const r = c.getBoundingClientRect();
        if (e.clientY < r.top + r.height / 2) { inserirAntes = c; break; }
    }
    inserirAntes ? zona.insertBefore(drag.placeholder, inserirAntes) : zona.appendChild(drag.placeholder);
}

// ── DRAG: SOLTAR ──────────────────────────────────────────
function onMouseUp(e) {
    if (!drag.ativo) return;

    drag.clone.style.visibility = "hidden";
    const elAbaixo = document.elementFromPoint(e.clientX, e.clientY);
    drag.clone.style.visibility = "";

    const zona = elAbaixo ? elAbaixo.closest(".kanban-drop-zone") : null;
    const novoStatus = zona ? zona.dataset.status : null;

    drag.clone.remove();
    drag.placeholder.remove();
    Object.values(ZONAS).forEach(z => z.classList.remove("sobre"));

    const idParaSalvar  = drag.id;
    const statusOrigem  = drag.statusOrigem;
    const cardOriginal  = drag.cardEl;

    drag.ativo        = false;
    drag.cardEl       = null;
    drag.clone        = null;
    drag.placeholder  = null;
    drag.id           = null;
    drag.statusOrigem = null;

    if (novoStatus && novoStatus !== statusOrigem) {
        cardOriginal.dataset.status = novoStatus;
        cardOriginal.style.visibility = "";

        // Remove "sem demandas" da zona destino
        const vazio = zona.querySelector(".col-vazia");
        if (vazio) vazio.remove();

        zona.appendChild(cardOriginal);

        // Verifica se zona origem ficou vazia
        const zonaOrigem = ZONAS[statusOrigem];
        if (!zonaOrigem.querySelector(".kanban-card")) {
            zonaOrigem.innerHTML = '<div class="col-vazia"><span>📭</span>Sem demandas aqui</div>';
        }

        // Atualiza contadores
        const cOrig = CONTADORES[statusOrigem];
        const cDest = CONTADORES[novoStatus];
        if (cOrig) cOrig.textContent = Math.max(0, parseInt(cOrig.textContent) - 1);
        if (cDest) cDest.textContent = (parseInt(cDest.textContent) || 0) + 1;

        // Salva no Supabase
        salvarStatus(idParaSalvar, novoStatus);
    } else {
        cardOriginal.style.visibility = "";
    }
}

// ── SALVAR STATUS ─────────────────────────────────────────
async function salvarStatus(id, novoStatus) {
    mostrarToast("Salvando...");

    const { error } = await supabaseClient
        .from("Solicitacoes")
        .update({ status: novoStatus })
        .eq("id", id);

    if (error) {
        console.error(error);
        mostrarToast("❌ Erro ao salvar.");
        setTimeout(carregarKanban, 800);
        return;
    }

    mostrarToast("✅ Movido para " + STATUS_LABEL[novoStatus]);
}

// ── MODAL DETALHE ─────────────────────────────────────────
let dadosCache = {};

async function abrirModal(id) {
    // Busca os dados do card no banco se não estiver em cache
    if (!dadosCache[id]) {
        const { data } = await supabaseClient.from("Solicitacoes").select("*").eq("id", id).single();
        if (data) dadosCache[id] = data;
    }

    const item = dadosCache[id];
    if (!item) return;

    const prioClasse = (item.prioridade || "Baixa").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    const prioColors = { alta:"#fee2e2;color:#dc2626", media:"#fef3c7;color:#d97706", baixa:"#dcfce7;color:#16a34a" };

    document.getElementById("mBadge").textContent    = STATUS_LABEL[item.status] || item.status;
    document.getElementById("mTitulo").textContent   = item.tipo || "—";
    document.getElementById("mPrio").textContent     = "Prioridade " + (item.prioridade || "Baixa");
    document.getElementById("mPrio").style.cssText   = `background:${prioColors[prioClasse]||"#f3f4f6;color:#374151"};`;

    const c = (label, valor, link=false, img=false, video=false) => {
        if (!valor) return `<div class="modal-campo"><label>${label}</label><p class="vazio">—</p></div>`;
        if (link)  return `<div class="modal-campo"><label>${label}</label><a href="${valor}" target="_blank">${valor}</a></div>`;
        if (img)   return `<div class="modal-campo"><label>${label}</label><a href="${valor}" target="_blank"><img src="${valor}" alt="Referência"></a></div>`;
        if (video) return `<div class="modal-campo"><label>${label}</label><video src="${valor}" controls></video></div>`;
        return `<div class="modal-campo"><label>${label}</label><p>${valor}</p></div>`;
    };

    const isImg   = /\.(jpg|jpeg|png|gif|webp)/i.test(item.arquivo_url||"");
    const isVideo = /\.(mp4|mov|webm)/i.test(item.arquivo_url||"");

    document.getElementById("mCorpo").innerHTML = `
        <div class="modal-secao">
            <div class="modal-secao-titulo">👤 Solicitante</div>
            ${c("Nome",    item.nome)}
            ${c("Setor",   item.setor)}
            ${c("WhatsApp",item.whatsapp)}
            ${c("E-mail",  item.email_solicitante)}
        </div>
        <div class="modal-secao">
            <div class="modal-secao-titulo">🎨 Informações da Arte</div>
            ${c("Tipo da Peça",      item.tipo)}
            ${c("Campanha",          item.campanha)}
            ${c("Objetivo",          item.objetivo)}
            ${c("Texto Obrigatório", item.texto_obrigatorio)}
            ${c("Público-Alvo",      item.publico_alvo)}
        </div>
        <div class="modal-secao">
            <div class="modal-secao-titulo">📅 Prazo</div>
            ${c("Data de Entrega", formatarData(item.entrega))}
            ${c("Prioridade",      item.prioridade)}
        </div>
        <div class="modal-secao">
            <div class="modal-secao-titulo">📎 Referências</div>
            ${item.arquivo_url ? c("Arquivo", item.arquivo_url, false, isImg, isVideo) : c("Arquivo", null)}
            ${c("Link de Referência", item.link_referencia, true)}
        </div>
        ${item.observacoes ? `
        <div class="modal-secao">
            <div class="modal-secao-titulo">📝 Observações</div>
            ${c("Observações", item.observacoes)}
        </div>` : ""}
    `;

    document.getElementById("modalDetalhe").classList.add("open");
}

function fecharModal() {
    document.getElementById("modalDetalhe").classList.remove("open");
}

document.getElementById("modalDetalhe").addEventListener("click", function(e) {
    if (e.target === this) fecharModal();
});

// ── UTILITÁRIOS ───────────────────────────────────────────
function formatarData(iso) {
    if (!iso) return "—";
    const p = iso.split("-");
    return p.length < 3 ? iso : `${p[2]}/${p[1]}`;
}

function mostrarToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(mostrarToast._t);
    mostrarToast._t = setTimeout(() => t.classList.remove("show"), 2500);
}

function confirmarLimpar() {
    if (!confirm("Apagar TODAS as solicitações? Essa ação não pode ser desfeita.")) return;
    supabaseClient.from("Solicitacoes").delete().neq("id", 0).then(({ error }) => {
        if (error) { mostrarToast("❌ Erro ao limpar."); return; }
        dadosCache = {};
        carregarKanban();
    });
}

function fazerLogout() {
    supabaseClient.auth.signOut().then(() => { window.location.href = "login.html"; });
}
</script>
